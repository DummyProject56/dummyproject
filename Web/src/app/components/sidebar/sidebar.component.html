<aside class="sidebar">
  <div class="brand">
    <div class="brand-icon">EM</div>
    <div>
      <strong>Employee MS</strong>
      <small>Management System</small>
    </div>
  </div>
  <nav>
    <a
      *ngFor="let item of menuItems"
      [routerLink]="item.path"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true }"
    >
      <span>{{ item.icon }}</span>
      {{ item.label }}
    </a>
  </nav>
</aside>
