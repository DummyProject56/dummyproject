<div class="form-page">
  <div class="page-header">
    <div>
      <h2>{{ employeeId ? "Edit Employee" : "Create Employee" }}</h2>
      <p>Enter employee infromation below.</p>
    </div>
  </div>
  <form class="form-card" [formGroup]="employeeForm" (ngSubmit)="save()">
    <div class="form-section">
      <div class="section-title">
        <h3>Employee Infromation</h3>
      </div>
      <div class="form-grid">
        <div class="form-group">
          <label for="name">Full Name <span class="required">*</span></label>
          <input
            type="text"
            formControlName="name"
            placeholder="Enter full name"
          />
          <small
            class="error-text"
            *ngIf="
              employeeForm.get('name')?.invalid &&
              employeeForm.get('name')?.touched
            "
          >
            Name is required
          </small>
        </div>
        <div class="form-group">
          <label for="email">
            Email Address <span class="required">*</span>
          </label>
          <input
            type="email"
            formControlName="email"
            placeholder="Enter email address"
          />
          <small
            class="error-text"
            *ngIf="
              employeeForm.get('email')?.invalid &&
              employeeForm.get('email')?.touched
            "
            >Enter a valid email address
          </small>
        </div>
        <div class="form-group">
          <label for="department"
            >Department <span class="required">*</span>
          </label>
          <input
            type="text"
            formControlName="department"
            placeholder="Enter department"
          />
          <small
            class="error-text"
            *ngIf="
              employeeForm.get('department')?.invalid &&
              employeeForm.get('department')?.touched
            "
            >Department is required
          </small>
        </div>
        <div class="form-group">
          <label for="designation"
            >Designation <span class="required">*</span>
          </label>
          <input
            type="text"
            formControlName="designation"
            placeholder="Enter designation"
          />
          <small
            class="error-text"
            *ngIf="
              employeeForm.get('designation')?.invalid &&
              employeeForm.get('designation')?.touched
            "
            >Designation is required
          </small>
        </div>
        <div class="form-group">
          <label for="joiningDate"
            >Joining Date <span class="required">*</span>
          </label>
          <input type="date" formControlName="joiningDate" />
          <small
            class="error-text"
            *ngIf="
              employeeForm.get('joiningDate')?.invalid &&
              employeeForm.get('joiningDate')?.touched
            "
            >Joining Date is required
          </small>
        </div>
        <div class="form-group">
          <label for="status">Status <span class="required">*</span> </label>
          <select formControlName="status">
            <option value="Active">Active</option>
            <option value="Inactive">Inactive</option>
          </select>
          <small
            class="error-text"
            *ngIf="
              employeeForm.get('status')?.invalid &&
              employeeForm.get('status')?.touched
            "
            >Status is required
          </small>
        </div>
      </div>
    </div>
    <div class="error-message" *ngIf="errorMessage">{{ errorMessage }}</div>
    <div class="form-actions">
      <button type="button" class="btn btn-secondary" routerLink="/employee">
        Cancel
      </button>
      <button
        type="submit"
        class="btn btn-primary"
        [disabled]="employeeForm.invalid"
      >
        {{ employeeId ? "Update Employee" : "Save" }}
      </button>
    </div>
  </form>
</div>
